services:
  scraper:
    build: .
    container_name: sermon-scraper
    volumes:
      # No full-repo bind mount: the image (via COPY . . in the Dockerfile)
      # already has its own code copy, and the container now runs as a
      # non-root user -- host repo write access isn't needed at runtime.
      # For active local dev, temporarily add back `- .:/app`.
      - ./audio:/app/audio        # Persist downloads
      - ./text:/app/text          # Persist transcripts
    cpus: "4.0"          # Give it up to 4 CPU cores
    mem_limit: "6g"      # Give it up to 6GB of RAM
    mem_reservation: "2g"
    stdin_open: true
    tty: true
